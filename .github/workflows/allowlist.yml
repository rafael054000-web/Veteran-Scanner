name: Atualizar allowlist de Fast Flags

# Baixa todo dia a allowlist oficial do Roblox e salva uma cópia no repositório.
# O scanner usa essa cópia quando não consegue baixar direto do Roblox.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_allowlist.py", ".github/workflows/allowlist.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_allowlist.py
      - name: Salvar se mudou
        run: |
          if git diff --quiet; then echo "Sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Atualiza allowlist de Fast Flags"
          git push
