name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validar JSON de dados
        run: python -c "import json,glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('fairscan/data/*.json')]"
      - name: Testes
        run: python -m unittest discover -s tests -v
