[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fairscan"
version = "1.0.0"
description = "Scanner open source, com consentimento e somente leitura, para campeonatos comunitários de Roblox"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
fairscan = "fairscan.cli:entry"

[tool.setuptools]
packages = ["fairscan", "fairscan.checks"]

[tool.setuptools.package-data]
fairscan = ["data/*.json"]
