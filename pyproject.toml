[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veteran-scanner"
version = "1.1.0"
description = "Scanner open source, com consentimento e somente leitura, para ligas comunitárias de Roblox"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
veteran-scanner = "veteran_scanner.cli:entry"

[tool.setuptools]
packages = ["veteran_scanner", "veteran_scanner.checks"]

[tool.setuptools.package-data]
veteran_scanner = ["data/*.json"]
